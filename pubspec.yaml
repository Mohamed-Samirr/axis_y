name: axis_y
description: "AXIS Y — Egyptian virtual clothing try-on app."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (MVVM: Cubit = ViewModel)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.7

  # Persistence
  shared_preferences: ^2.3.2

  # UI helpers
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Networking (body scan API)
  dio: ^5.7.0
  http_parser: ^4.0.2

  # Camera + files
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  image_picker: ^1.1.2

  # 3D viewer for the scanned body mesh (.glb)
  model_viewer_plus: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
