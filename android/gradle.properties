org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler stores plugin sources as paths relative to the
# project, which it cannot do when the pub cache and the project sit on
# different drives (C:\...\Pub\Cache vs D:\...\axis_y). Every from-scratch build
# then dies in "Could not close incremental caches". Nothing here is a Kotlin
# codebase — only the plugins are — so the lost incrementality costs nothing.
kotlin.incremental=false
